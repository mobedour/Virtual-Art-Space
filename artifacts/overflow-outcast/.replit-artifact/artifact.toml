kind = "web"
previewPath = "/"
title = "Virtual Art Space"
version = "1.0.0"
id = "artifacts/overflow-outcast"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23679

[services.development]
run = "pnpm --filter @workspace/overflow-outcast run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/overflow-outcast", "run", "build" ]
publicDir = "artifacts/overflow-outcast/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23679"
BASE_PATH = "/"
