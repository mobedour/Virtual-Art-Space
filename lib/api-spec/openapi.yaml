openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Overflow Outcast - Virtual Reality Art Exhibition Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: profile
    description: Artist profile operations
  - name: galleries
    description: Gallery management
  - name: artworks
    description: Artwork management
  - name: public
    description: Public visitor endpoints

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user (Clerk-backed)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get authenticated artist's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Update artist profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /galleries:
    get:
      operationId: listGalleries
      tags: [galleries]
      summary: List authenticated artist's galleries
      responses:
        "200":
          description: List of galleries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gallery"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createGallery
      tags: [galleries]
      summary: Create a new gallery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryInput"
      responses:
        "201":
          description: Created gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /galleries/{id}:
    get:
      operationId: getGallery
      tags: [galleries]
      summary: Get a gallery by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateGallery
      tags: [galleries]
      summary: Update a gallery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryUpdate"
      responses:
        "200":
          description: Updated gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteGallery
      tags: [galleries]
      summary: Delete a gallery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /galleries/{id}/publish:
    patch:
      operationId: toggleGalleryPublish
      tags: [galleries]
      summary: Toggle gallery published state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishToggle"
      responses:
        "200":
          description: Updated gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gallery"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /artworks/gallery/{galleryId}:
    get:
      operationId: listArtworks
      tags: [artworks]
      summary: List artworks in a gallery
      parameters:
        - name: galleryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of artworks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artwork"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /artworks:
    post:
      operationId: createArtwork
      tags: [artworks]
      summary: Create an artwork in a gallery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtworkInput"
      responses:
        "201":
          description: Created artwork
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artwork"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /artworks/{id}:
    put:
      operationId: updateArtwork
      tags: [artworks]
      summary: Update an artwork
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtworkUpdate"
      responses:
        "200":
          description: Updated artwork
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artwork"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteArtwork
      tags: [artworks]
      summary: Delete an artwork
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /public/galleries:
    get:
      operationId: listPublicGalleries
      tags: [public]
      summary: Browse all published galleries
      responses:
        "200":
          description: Published galleries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicGallery"

  /public/galleries/{slug}:
    get:
      operationId: getPublicGallery
      tags: [public]
      summary: Get a published gallery by slug with artworks
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public gallery with artworks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicGalleryDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [profile]
      summary: Get artist dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        username:
          type: string
        createdAt:
          type: string
      required:
        - id
        - email
        - username
        - createdAt

    Profile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        displayName:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
      required:
        - id
        - userId

    ProfileInput:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string

    Gallery:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        roomTheme:
          type: string
        published:
          type: boolean
        slug:
          type: string
        artworkCount:
          type: integer
        createdAt:
          type: string
        roomSeed:
          type: integer
        roomMode:
          type: string
        roomSize:
          type: integer
        decorationLevel:
          type: integer
      required:
        - id
        - userId
        - title
        - roomTheme
        - published
        - slug
        - artworkCount
        - createdAt
        - roomSeed
        - roomMode
        - roomSize
        - decorationLevel

    GalleryInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        roomTheme:
          type: string
        roomMode:
          type: string
        roomSize:
          type: integer
          minimum: 1
          maximum: 10
        decorationLevel:
          type: integer
          minimum: 1
          maximum: 10
        roomSeed:
          type: integer
      required:
        - title

    GalleryUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        roomTheme:
          type: string
        roomMode:
          type: string
        roomSize:
          type: integer
          minimum: 1
          maximum: 10
        decorationLevel:
          type: integer
          minimum: 1
          maximum: 10

    PublishToggle:
      type: object
      properties:
        published:
          type: boolean
      required:
        - published

    Artwork:
      type: object
      properties:
        id:
          type: integer
        galleryId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: string
        artistName:
          type: ["string", "null"]
        year:
          type: ["string", "null"]
        medium:
          type: ["string", "null"]
        dimensions:
          type: ["string", "null"]
        xPosition:
          type: number
        yPosition:
          type: number
        zPosition:
          type: number
        rotation:
          type: number
        scale:
          type: number
        isManuallyPlaced:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - galleryId
        - title
        - imageUrl
        - xPosition
        - yPosition
        - zPosition
        - rotation
        - scale
        - isManuallyPlaced
        - createdAt

    ArtworkInput:
      type: object
      properties:
        galleryId:
          type: integer
        title:
          type: string
          minLength: 1
        description:
          type: string
        imageUrl:
          type: string
        artistName:
          type: string
        year:
          type: string
        medium:
          type: string
        dimensions:
          type: string
        xPosition:
          type: number
        yPosition:
          type: number
        zPosition:
          type: number
        rotation:
          type: number
        scale:
          type: number
        isManuallyPlaced:
          type: boolean
      required:
        - galleryId
        - title
        - imageUrl

    ArtworkUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        artistName:
          type: string
        year:
          type: string
        medium:
          type: string
        dimensions:
          type: string
        xPosition:
          type: number
        yPosition:
          type: number
        zPosition:
          type: number
        rotation:
          type: number
        scale:
          type: number
        isManuallyPlaced:
          type: boolean

    UploadResponse:
      type: object
      properties:
        url:
          type: string
      required:
        - url

    PublicGallery:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        slug:
          type: string
        roomTheme:
          type: string
        roomSize:
          type: integer
        artworkCount:
          type: integer
        artistName:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - title
        - slug
        - roomTheme
        - roomSize
        - artworkCount
        - createdAt

    PublicGalleryDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        slug:
          type: string
        roomTheme:
          type: string
        roomSeed:
          type: integer
        roomMode:
          type: string
        roomSize:
          type: integer
        decorationLevel:
          type: integer
        artistName:
          type: ["string", "null"]
        artworks:
          type: array
          items:
            $ref: "#/components/schemas/Artwork"
      required:
        - id
        - title
        - slug
        - roomTheme
        - roomSeed
        - roomMode
        - roomSize
        - decorationLevel
        - artworks

    DashboardStats:
      type: object
      properties:
        totalGalleries:
          type: integer
        publishedGalleries:
          type: integer
        totalArtworks:
          type: integer
        recentGalleries:
          type: array
          items:
            $ref: "#/components/schemas/Gallery"
      required:
        - totalGalleries
        - publishedGalleries
        - totalArtworks
        - recentGalleries
